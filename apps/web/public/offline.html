<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123d35" />
    <title>Offline | Uneventful</title>
    <style>
      body {
        background: #f6f7f1;
        color: #12231f;
        font:
          1rem/1.6 system-ui,
          sans-serif;
        margin: 0;
        padding: 3rem 1.25rem;
      }
      main {
        margin: 12vh auto 0;
        max-width: 34rem;
      }
      h1 {
        color: #123d35;
      }
      a {
        color: #123d35;
        font-weight: 700;
      }
      a:focus-visible {
        outline: 3px solid #b53b28;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Uneventful couldn’t reach the network. Your account and event data are never stored for
        offline use.
      </p>
      <a href="/events">Try again</a>
    </main>
  </body>
</html>
