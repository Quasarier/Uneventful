openapi: 3.1.0
info:
  title: Uneventful frontend API
  version: 1.0.0
  description: >-
    OpenAPI contracts consumed by the Uneventful web application. The
    authenticated event-day Socket.IO contract is documented in
    ../../docs/realtime-dashboard.md and is served at the API origin namespace
    /realtime; access tokens are sent only in the handshake auth payload.
servers:
  - url: http://localhost:3001/api/v1
    description: Local development
paths:
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the current refresh session
      security: []
      parameters:
        - in: header
          name: X-Uneventful-CSRF
          required: true
          schema:
            type: string
            const: '1'
      responses:
        '200':
          description: A rotated session and access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current refresh session
      security: []
      parameters:
        - in: header
          name: X-Uneventful-CSRF
          required: true
          schema:
            type: string
            const: '1'
      responses:
        '204':
          description: The session was revoked.
        '403':
          $ref: '#/components/responses/Error'
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user's public profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Error'
  /me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      summary: Get the authenticated user's notification preferences
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's channel preferences, push count, and public VAPID key.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      operationId: updateNotificationPreferences
      summary: Update the authenticated user's channel preferences and consent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchNotificationPreferencesRequest'
      responses:
        '200':
          description: The updated preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/push-subscriptions:
    post:
      operationId: addPushSubscription
      summary: Register an HTTPS Web Push subscription for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionRequest'
      responses:
        '204':
          description: The subscription was stored without returning its endpoint or keys.
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: removePushSubscription
      summary: Remove one of the authenticated user's Web Push subscriptions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletePushSubscriptionRequest'
      responses:
        '204':
          description: The subscription was removed, if it existed.
        '429':
          $ref: '#/components/responses/RateLimited'
  /unsubscribe:
    post:
      operationId: unsubscribeEmail
      summary: Idempotently unsubscribe using a signed email token
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1024
      responses:
        '204':
          description: The request was handled without revealing whether an account exists.
        '429':
          $ref: '#/components/responses/RateLimited'
  /events:
    post:
      operationId: createEvent
      summary: Create a draft event with an optional venue booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: The created event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      operationId: listEvents
      summary: List visible events
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: clubId
          schema:
            type: string
            format: uuid
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: A page of events visible to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '401':
          $ref: '#/components/responses/Error'
  /events/series:
    post:
      operationId: createEventSeries
      summary: Atomically create a bounded recurring event series
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventSeriesRequest'
      responses:
        '201':
          description: The created series and its events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSeriesResult'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/VenueConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /venues:
    get:
      operationId: listVenues
      summary: List active venues
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active venues with allowlisted availability details.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueList'
    post:
      operationId: createVenue
      summary: Create a venue (administrators only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVenueRequest'
      responses:
        '201':
          description: The created venue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '429':
          $ref: '#/components/responses/RateLimited'
  /venues/conflicts:
    post:
      operationId: checkVenueConflicts
      summary: Check venue availability and suggest alternatives
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueConflictRequest'
      responses:
        '200':
          description: The requested venue is available.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueAvailabilityResult'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/VenueConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /venues/{id}:
    get:
      operationId: getVenue
      summary: Get an active venue
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '200':
          description: The venue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateVenue
      summary: Update a venue (administrators only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVenueRequest'
      responses:
        '200':
          description: The updated venue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: retireVenue
      summary: Retire a venue (administrators only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '200':
          description: The retired venue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /events/{id}:
    get:
      operationId: getEvent
      summary: Get an event visible to the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateEvent
      summary: Update an event and synchronize its venue booking
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: The updated event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/VenueConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: deleteEvent
      summary: Soft-delete an event and release its venue booking
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: The event was deleted.
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /events/{id}/attendees:
    get:
      operationId: listEventAttendees
      summary: List attendee display names for an event
      description: >
        Organizers must have active membership in the event's club. Admins may list attendees
        for any non-deleted event. Cancelled attendees are excluded unless an admin explicitly
        filters for CANCELLED. Limits above 100 are capped at 100.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - in: query
          name: limit
          description: Requested page size; values above 100 are capped at 100.
          schema:
            type: integer
            minimum: 1
            default: 20
        - in: query
          name: status
          description: CANCELLED is returned only to admins who explicitly request it.
          schema:
            type: string
            enum: [GOING, WAITLISTED, CHECKED_IN, CANCELLED]
      responses:
        '200':
          description: Paginated attendee display names and RSVP state.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAttendeePage'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          description: Global or per-user request rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /events/{id}/checkin-manifest:
    get:
      operationId: getCheckinManifest
      summary: Download a paginated offline check-in manifest
      description: >
        Organizers with active membership in the event club and admins may download public
        verification keys and ticket ID hashes. Each page is capped at 500 entries and audited.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - in: query
          name: cursor
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        '200':
          description: A bounded page of ticket identifiers and public verification keys.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinManifest'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /events/{id}/checkins:
    post:
      operationId: checkinTicket
      summary: Verify and atomically consume a signed ticket
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinTicketRequest'
      responses:
        '201':
          description: The ticket was checked in or had already been used.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinResult'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /events/{id}/checkins/sync:
    post:
      operationId: syncOfflineCheckins
      summary: Idempotently sync a bounded batch of offline scans
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflineCheckinBatch'
      responses:
        '201':
          description: Per-scan sync results; invalid items do not fail the batch.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineCheckinBatchResult'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /events/{id}/checkins/lookup:
    get:
      operationId: lookupCheckinAttendees
      summary: Search attendees by display name for manual check-in
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Allowlisted attendee display names and check-in state.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualCheckinLookupResult'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /events/{id}/checkins/manual:
    post:
      operationId: manualCheckinAttendee
      summary: Check in a confirmed attendee by RSVP ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualCheckinRequest'
      responses:
        '201':
          description: The attendee was manually checked in.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinResult'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /events/{id}/rsvp/status:
    get:
      operationId: getEventRsvpStatus
      summary: Get the current user's RSVP and capacity status
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: RSVP and capacity state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRsvpStatus'
        '404':
          $ref: '#/components/responses/Error'
  /events/{id}/rsvp:
    post:
      operationId: createRsvp
      summary: RSVP to an event or join its waitlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checkConflicts:
                  type: boolean
                  default: false
      responses:
        '201':
          description: RSVP created.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RsvpResult'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      operationId: cancelRsvp
      summary: Cancel the current user's RSVP
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: RSVP cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelledRsvp'
        '404':
          $ref: '#/components/responses/Error'
  /events/{id}/rsvp/ticket:
    post:
      operationId: issueTicket
      summary: Issue or rotate a ticket for a confirmed RSVP
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '201':
          description: A ticket token. Keep it in memory and do not cache it.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketToken'
        '409':
          $ref: '#/components/responses/Error'
  /rsvps/me:
    get:
      operationId: listMyRsvps
      summary: List the authenticated user's active RSVPs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active RSVP records and safe ticket metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyRsvps'
        '401':
          $ref: '#/components/responses/Error'
  /events/{id}/analytics:
    get:
      operationId: getEventAnalytics
      summary: Get privacy-suppressed aggregate analytics for an event
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
        - $ref: '#/components/parameters/AnalyticsBucket'
      responses:
        '200':
          description: Aggregate counts and trends with groups smaller than five suppressed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAnalytics'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /clubs/{id}/analytics:
    get:
      operationId: getClubAnalytics
      summary: Get privacy-suppressed aggregate analytics for a club
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
        - $ref: '#/components/parameters/AnalyticsBucket'
      responses:
        '200':
          description: Club aggregate counts and trends with small groups suppressed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubAnalytics'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /events/{id}/attendees/export:
    get:
      operationId: exportEventAttendees
      summary: Stream a capped attendee CSV for an event
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: UTF-8 CSV with a BOM; attendee rows are capped at 2,000.
          headers:
            Content-Disposition:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: private, no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            text/csv:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /recommendations:
    get:
      operationId: getRecommendations
      summary: Get personalized or popular upcoming event recommendations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Upcoming visible events and non-identifying recommendation reasons.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendations'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/recommendation-preference:
    get:
      operationId: getRecommendationPreference
      summary: Get the authenticated user's personalization setting
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Personalization preference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationPreference'
    patch:
      operationId: updateRecommendationPreference
      summary: Update personalization preference and record consent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationPreference'
      responses:
        '200':
          description: Updated personalization preference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationPreference'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/recommendation-data:
    delete:
      operationId: deleteRecommendationData
      summary: Delete derived recommendation cache data for the current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Derived recommendation data was deleted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  deleted:
                    type: boolean
                    const: true
                required: [deleted]
  /clubs/{id}/follow:
    post:
      operationId: followClub
      summary: Follow a club for recommendations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '201':
          description: The club is followed.
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: unfollowClub
      summary: Unfollow a club
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: The club is no longer followed.
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    EventId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    ClubId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    VenueId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    AnalyticsFrom:
      in: query
      name: from
      schema:
        type: string
        format: date-time
    AnalyticsTo:
      in: query
      name: to
      schema:
        type: string
        format: date-time
    AnalyticsBucket:
      in: query
      name: bucket
      schema:
        type: string
        enum: [day, week]
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Global or per-user request rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    VenueConflict:
      description: The venue conflicts with the requested event time or requirements.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VenueConflict'
  schemas:
    ApiError:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
      required: [statusCode, message]
    AnalyticsPeriod:
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        bucket:
          type: string
          enum: [day, week]
      required: [from, to, bucket]
    AnalyticsRsvpCounts:
      type: object
      additionalProperties: false
      properties:
        going:
          type: [integer, 'null']
        waitlisted:
          type: [integer, 'null']
        cancelled:
          type: [integer, 'null']
        checkedIn:
          type: [integer, 'null']
      required: [going, waitlisted, cancelled, checkedIn]
    AnalyticsTrend:
      type: object
      additionalProperties: false
      properties:
        bucket:
          type: string
          format: date-time
        total:
          type: [integer, 'null']
        going:
          type: [integer, 'null']
        waitlisted:
          type: [integer, 'null']
        cancelled:
          type: [integer, 'null']
        checkedIn:
          type: [integer, 'null']
      required: [bucket, total, going, waitlisted, cancelled, checkedIn]
    AnalyticsBucketCount:
      type: object
      additionalProperties: false
      properties:
        bucket:
          type: string
          format: date-time
        count:
          type: integer
          minimum: 5
      required: [bucket, count]
    AnalyticsPeakSignupHour:
      type: object
      additionalProperties: false
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
        signups:
          type: integer
          minimum: 5
      required: [hour, signups]
    EventAnalytics:
      type: object
      additionalProperties: false
      properties:
        eventId:
          type: string
          format: uuid
        period:
          $ref: '#/components/schemas/AnalyticsPeriod'
        rsvps:
          $ref: '#/components/schemas/AnalyticsRsvpCounts'
        noShowRate:
          type: [number, 'null']
          minimum: 0
          maximum: 100
        repeatAttendeeRate:
          type: [number, 'null']
          minimum: 0
          maximum: 100
        rsvpsOverTime:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AnalyticsTrend'
        checkInsByTime:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AnalyticsBucketCount'
        peakSignupHours:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/AnalyticsPeakSignupHour'
      required:
        - eventId
        - period
        - rsvps
        - noShowRate
        - repeatAttendeeRate
        - rsvpsOverTime
        - checkInsByTime
        - peakSignupHours
    ClubAnalytics:
      type: object
      additionalProperties: false
      properties:
        clubId:
          type: string
          format: uuid
        period:
          $ref: '#/components/schemas/AnalyticsPeriod'
        rsvps:
          $ref: '#/components/schemas/AnalyticsRsvpCounts'
        noShowRate:
          type: [number, 'null']
          minimum: 0
          maximum: 100
        repeatAttendeeRate:
          type: [number, 'null']
          minimum: 0
          maximum: 100
        rsvpsOverTime:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AnalyticsTrend'
        checkInsByTime:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AnalyticsBucketCount'
        peakSignupHours:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/AnalyticsPeakSignupHour'
        followerGrowth:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AnalyticsBucketCount'
        memberGrowth:
          type: array
          maxItems: 100
          items:
