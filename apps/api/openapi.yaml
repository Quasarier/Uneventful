openapi: 3.1.0
info:
  title: Uneventful frontend API
  version: 1.0.0
  description: >-
    OpenAPI contracts consumed by the Uneventful web application. The
    authenticated event-day Socket.IO contract is documented in
    ../../docs/realtime-dashboard.md and is served at the API origin namespace
    /realtime; access tokens are sent only in the handshake auth payload.
servers:
  - url: http://localhost:3001/api/v1
    description: Local development
paths:
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the current refresh session
      security: []
      parameters:
        - in: header
          name: X-Uneventful-CSRF
          required: true
          schema:
            type: string
            const: '1'
      responses:
        '200':
          description: A rotated session and access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current refresh session
      security: []
      parameters:
        - in: header
          name: X-Uneventful-CSRF
          required: true
          schema:
            type: string
            const: '1'
      responses:
        '204':
          description: The session was revoked.
        '403':
          $ref: '#/components/responses/Error'
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user's public profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Error'
  /events:
    post:
      operationId: createEvent
      summary: Create a draft event with an optional venue booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: The created event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      operationId: listEvents
      summary: List visible events
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: clubId
          schema:
            type: string
            format: uuid
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: A page of events visible to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '401':
          $ref: '#/components/responses/Error'
  /events/series:
    post:
      operationId: createEventSeries
      summary: Atomically create a bounded recurring event series
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventSeriesRequest'
      responses:
        '201':
          description: The created series and its events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSeriesResult'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/VenueConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /venues:
    get:
      operationId: listVenues
      summary: List active venues
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active venues with allowlisted availability details.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueList'
    post:
      operationId: createVenue
      summary: Create a venue (administrators only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVenueRequest'
      responses:
        '201':
          description: The created venue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '429':
          $ref: '#/components/responses/RateLimited'
  /venues/conflicts:
    post:
      operationId: checkVenueConflicts
      summary: Check venue availability and suggest alternatives
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueConflictRequest'
      responses:
        '200':
          description: The requested venue is available.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueAvailabilityResult'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/VenueConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /venues/{id}:
    get:
      operationId: getVenue
      summary: Get an active venue
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '200':
          description: The venue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateVenue
      summary: Update a venue (administrators only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVenueRequest'
      responses:
        '200':
          description: The updated venue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: retireVenue
      summary: Retire a venue (administrators only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '200':
          description: The retired venue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /events/{id}:
    get:
      operationId: getEvent
      summary: Get an event visible to the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateEvent
      summary: Update an event and synchronize its venue booking
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: The updated event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/VenueConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: deleteEvent
      summary: Soft-delete an event and release its venue booking
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: The event was deleted.
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /events/{id}/attendees:
    get:
      operationId: listEventAttendees
      summary: List attendee display names for an event
      description: >
        Organizers must have active membership in the event's club. Admins may list attendees
        for any non-deleted event. Cancelled attendees are excluded unless an admin explicitly
        filters for CANCELLED. Limits above 100 are capped at 100.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - in: query
          name: limit
          description: Requested page size; values above 100 are capped at 100.
          schema:
            type: integer
            minimum: 1
            default: 20
        - in: query
          name: status
          description: CANCELLED is returned only to admins who explicitly request it.
          schema:
            type: string
            enum: [GOING, WAITLISTED, CHECKED_IN, CANCELLED]
      responses:
        '200':
          description: Paginated attendee display names and RSVP state.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAttendeePage'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          description: Global or per-user request rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /events/{id}/checkin-manifest:
    get:
      operationId: getCheckinManifest
      summary: Download a paginated offline check-in manifest
      description: >
        Organizers with active membership in the event club and admins may download public
        verification keys and ticket ID hashes. Each page is capped at 500 entries and audited.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - in: query
          name: cursor
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        '200':
          description: A bounded page of ticket identifiers and public verification keys.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinManifest'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /events/{id}/checkins:
    post:
      operationId: checkinTicket
      summary: Verify and atomically consume a signed ticket
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinTicketRequest'
      responses:
        '201':
          description: The ticket was checked in or had already been used.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinResult'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /events/{id}/checkins/sync:
    post:
      operationId: syncOfflineCheckins
      summary: Idempotently sync a bounded batch of offline scans
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflineCheckinBatch'
      responses:
        '201':
          description: Per-scan sync results; invalid items do not fail the batch.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineCheckinBatchResult'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /events/{id}/checkins/lookup:
    get:
      operationId: lookupCheckinAttendees
      summary: Search attendees by display name for manual check-in
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Allowlisted attendee display names and check-in state.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualCheckinLookupResult'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /events/{id}/checkins/manual:
    post:
      operationId: manualCheckinAttendee
      summary: Check in a confirmed attendee by RSVP ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualCheckinRequest'
      responses:
        '201':
          description: The attendee was manually checked in.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinResult'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /events/{id}/rsvp/status:
    get:
      operationId: getEventRsvpStatus
      summary: Get the current user's RSVP and capacity status
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: RSVP and capacity state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRsvpStatus'
        '404':
          $ref: '#/components/responses/Error'
  /events/{id}/rsvp:
    post:
      operationId: createRsvp
      summary: RSVP to an event or join its waitlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checkConflicts:
                  type: boolean
                  default: false
      responses:
        '201':
          description: RSVP created.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RsvpResult'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      operationId: cancelRsvp
      summary: Cancel the current user's RSVP
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: RSVP cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelledRsvp'
        '404':
          $ref: '#/components/responses/Error'
  /events/{id}/rsvp/ticket:
    post:
      operationId: issueTicket
      summary: Issue or rotate a ticket for a confirmed RSVP
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '201':
          description: A ticket token. Keep it in memory and do not cache it.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketToken'
        '409':
          $ref: '#/components/responses/Error'
  /rsvps/me:
    get:
      operationId: listMyRsvps
      summary: List the authenticated user's active RSVPs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active RSVP records and safe ticket metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyRsvps'
        '401':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    EventId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    VenueId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Global or per-user request rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    VenueConflict:
      description: The venue conflicts with the requested event time or requirements.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VenueConflict'
  schemas:
    ApiError:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
      required: [statusCode, message]
    Session:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
      required: [accessToken, tokenType, expiresIn]
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: [string, 'null']
          format: uri
        role:
          type: string
          enum: [STUDENT, ORGANIZER, ADMIN]
      required: [id, email, firstName, lastName, avatarUrl, role]
    EventClub:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
      required: [name, slug]
    EventCategory:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
      required: [name, slug]
    VenueAvailabilityHour:
      type: object
      additionalProperties: false
      properties:
        weekday:
          type: integer
          minimum: 1
          maximum: 7
        opensAt:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
        closesAt:
          type: string
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
      required: [weekday, opensAt, closesAt]
    Venue:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        building:
          type: [string, 'null']
        capacity:
          type: integer
        bufferMinutes:
          type: integer
          minimum: 0
          maximum: 1440
        isActive:
          type: boolean
        availabilityHours:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/VenueAvailabilityHour'
      required: [id, name, building, capacity, bufferMinutes, isActive, availabilityHours]
    VenueList:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Venue'
      required: [data]
    CreateVenueRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        building:
          type: [string, 'null']
          maxLength: 160
        capacity:
          type: integer
          minimum: 1
          maximum: 100000
        bufferMinutes:
          type: integer
          minimum: 0
          maximum: 1440
        availabilityHours:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/VenueAvailabilityHour'
      required: [name, capacity, bufferMinutes, availabilityHours]
    UpdateVenueRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        building:
          type: [string, 'null']
          maxLength: 160
        capacity:
          type: integer
          minimum: 1
          maximum: 100000
        bufferMinutes:
          type: integer
          minimum: 0
          maximum: 1440
        isActive:
          type: boolean
        availabilityHours:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/VenueAvailabilityHour'
    RecurrenceRule:
      type: object
      additionalProperties: false
      properties:
        frequency:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY]
        interval:
          type: integer
          minimum: 1
          maximum: 12
        count:
          type: integer
          minimum: 1
          maximum: 52
        untilDate:
          type: string
          format: date
      required: [frequency, interval]
    CreateEventRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 20000
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        timeZone:
          type: string
          maxLength: 64
        capacity:
          type: [integer, 'null']
          minimum: 1
          maximum: 100000
        expectedAttendance:
          type: [integer, 'null']
          minimum: 1
          maximum: 100000
        isPublic:
          type: boolean
        clubId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        venueId:
          type: [string, 'null']
          format: uuid
      required: [title, description, startAt, endAt, timeZone, isPublic, clubId, categoryId]
    UpdateEventRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 20000
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        timeZone:
          type: string
          maxLength: 64
        capacity:
          type: [integer, 'null']
          minimum: 1
          maximum: 100000
        expectedAttendance:
          type: [integer, 'null']
          minimum: 1
          maximum: 100000
        isPublic:
          type: boolean
        categoryId:
          type: string
          format: uuid
        venueId:
          type: [string, 'null']
          format: uuid
    CreateEventSeriesRequest:
      allOf:
        - $ref: '#/components/schemas/CreateEventRequest'
        - type: object
          additionalProperties: false
          properties:
            recurrence:
              $ref: '#/components/schemas/RecurrenceRule'
            exceptionDates:
              type: array
              maxItems: 52
              uniqueItems: true
              items:
                type: string
                format: date
          required: [recurrence, exceptionDates]
    EventSeriesResult:
      type: object
      additionalProperties: false
      properties:
        seriesId:
          type: string
          format: uuid
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
      required: [seriesId, events]
    VenueSlot:
      type: object
      additionalProperties: false
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
      required: [startAt, endAt]
    VenueAlternative:
      allOf:
        - $ref: '#/components/schemas/VenueSlot'
        - type: object
          additionalProperties: false
          properties:
            venueId:
              type: string
              format: uuid
            name:
              type: string
            building:
              type: [string, 'null']
          required: [venueId, name, building]
    VenueConflict:
      type: object
      additionalProperties: false
      properties:
        statusCode:
          type: integer
          const: 409
        code:
          type: string
          const: CONFLICT
        message:
          type: string
        path:
          type: string
        reasons:
          type: array
          items:
            type: string
            enum: [BOOKING_CONFLICT, CAPACITY, OUTSIDE_HOURS, PAST_START]
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/VenueSlot'
        alternatives:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/VenueAlternative'
      required: [statusCode, code, message, path, reasons, conflicts, alternatives]
    VenueConflictRequest:
      type: object
      additionalProperties: false
      properties:
        venueId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        expectedAttendance:
          type: integer
          minimum: 1
          maximum: 100000
        eventId:
          type: string
          format: uuid
        recurrence:
          $ref: '#/components/schemas/RecurrenceRule'
        exceptionDates:
          type: array
          maxItems: 52
          uniqueItems: true
          items:
            type: string
            format: date
      required: [venueId, startAt, endAt, expectedAttendance]
    VenueAvailabilityResult:
      type: object
      additionalProperties: false
      properties:
        available:
          type: boolean
          const: true
        conflicts:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/VenueSlot'
        alternatives:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/VenueAlternative'
      required: [available, conflicts, alternatives]
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, CANCELLED]
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        timeZone:
          type: string
        capacity:
          type: [integer, 'null']
        expectedAttendance:
          type: [integer, 'null']
        isPublic:
          type: boolean
        venue:
          oneOf:
            - $ref: '#/components/schemas/EventVenue'
            - type: 'null'
        clubId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        rejectionReason:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        hasImage:
          type: boolean
        club:
          $ref: '#/components/schemas/EventClub'
        category:
          $ref: '#/components/schemas/EventCategory'
      required:
        - id
        - title
        - slug
        - description
        - status
        - startAt
        - endAt
        - timeZone
        - capacity
        - expectedAttendance
        - isPublic
        - venue
        - clubId
        - categoryId
        - rejectionReason
        - createdAt
        - updatedAt
        - hasImage
        - club
        - category
    EventVenue:
