      required:
        - clubId
        - period
        - rsvps
        - noShowRate
        - repeatAttendeeRate
        - rsvpsOverTime
        - checkInsByTime
        - peakSignupHours
        - followerGrowth
        - memberGrowth
    RecommendationEvent:
