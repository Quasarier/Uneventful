name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
        env:
          POSTGRES_DB: uneventful_ci
          POSTGRES_USER: uneventful_ci_bootstrap
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uneventful_ci_bootstrap -d uneventful_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Verify lockfile matches manifests
        run: pnpm install --lockfile-only --frozen-lockfile --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --verify-store-integrity

      - name: Generate disposable test credentials
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { randomBytes } = require('node:crypto');
          const values = {
            E2E_APP_DB_PASSWORD: randomBytes(24).toString('base64url'),
            E2E_MIGRATOR_DB_PASSWORD: randomBytes(24).toString('base64url'),
            E2E_S3_ACCESS_KEY: `e2e${randomBytes(12).toString('hex')}`,
            E2E_S3_SECRET_KEY: randomBytes(32).toString('hex'),
            E2E_TEST_AUTH_BYPASS_SECRET: randomBytes(32).toString('base64url'),
          };
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            Object.entries(values).map(([key, value]) => `${key}=${value}\n`).join(''),
            { mode: 0o600 }
          );
          for (const value of Object.values(values)) {
            console.log(`::add-mask::${value}`);
          }
          NODE

      - name: Provision separate migration and application roles
        run: psql "$BOOTSTRAP_DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/provision-roles.sql
        env:
          BOOTSTRAP_DATABASE_URL: postgresql://uneventful_ci_bootstrap:test-only@localhost:5432/uneventful_ci
          UNEVENTFUL_MIGRATOR_DB_PASSWORD: ${{ env.E2E_MIGRATOR_DB_PASSWORD }}
          UNEVENTFUL_APP_DB_PASSWORD: ${{ env.E2E_APP_DB_PASSWORD }}

      - name: Validate Prisma schema and generate client
        run: |
          pnpm --filter @uneventful/api db:validate
          pnpm --filter @uneventful/api db:generate
        env:
          DATABASE_URL: postgresql://uneventful_app:${{ env.E2E_APP_DB_PASSWORD }}@localhost:5432/uneventful_ci?schema=public
          MIGRATION_DATABASE_URL: postgresql://uneventful_migrator:${{ env.E2E_MIGRATOR_DB_PASSWORD }}@localhost:5432/uneventful_ci?schema=public
          NODE_ENV: test

      - name: Apply migrations and verify Prisma schema
        run: |
          pnpm --filter @uneventful/api db:deploy
          pnpm --filter @uneventful/api exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
        env:
          DATABASE_URL: postgresql://uneventful_app:${{ env.E2E_APP_DB_PASSWORD }}@localhost:5432/uneventful_ci?schema=public
          MIGRATION_DATABASE_URL: postgresql://uneventful_migrator:${{ env.E2E_MIGRATOR_DB_PASSWORD }}@localhost:5432/uneventful_ci?schema=public
          SHADOW_DATABASE_URL: postgresql://uneventful_migrator:${{ env.E2E_MIGRATOR_DB_PASSWORD }}@localhost:5432/uneventful_ci_shadow?schema=public
          NODE_ENV: test

      - name: Seed test data
        run: pnpm --filter @uneventful/api db:seed
        env:
          DATABASE_URL: postgresql://uneventful_app:${{ env.E2E_APP_DB_PASSWORD }}@localhost:5432/uneventful_ci?schema=public
          MIGRATION_DATABASE_URL: postgresql://uneventful_migrator:${{ env.E2E_MIGRATOR_DB_PASSWORD }}@localhost:5432/uneventful_ci?schema=public
          NODE_ENV: test

      - name: Format check
        run: pnpm format:check

      - name: Verify constraints and application-role privileges
        run: pnpm --filter @uneventful/api exec prisma db execute --file prisma/verify-constraints.sql
        env:
          DATABASE_URL: postgresql://uneventful_app:${{ env.E2E_APP_DB_PASSWORD }}@localhost:5432/uneventful_ci?schema=public
          MIGRATION_DATABASE_URL: postgresql://uneventful_app:${{ env.E2E_APP_DB_PASSWORD }}@localhost:5432/uneventful_ci?schema=public
          NODE_ENV: test

      - name: Verify audit-log triggers as migration owner
        run: pnpm --filter @uneventful/api exec prisma db execute --file prisma/verify-audit-immutability.sql
        env:
          DATABASE_URL: postgresql://uneventful_app:${{ env.E2E_APP_DB_PASSWORD }}@localhost:5432/uneventful_ci?schema=public
          MIGRATION_DATABASE_URL: postgresql://uneventful_migrator:${{ env.E2E_MIGRATOR_DB_PASSWORD }}@localhost:5432/uneventful_ci?schema=public
          NODE_ENV: test

      - name: Verify seed refuses production
        shell: bash
        run: |
          if output="$(env NODE_ENV=production DATABASE_URL=postgresql://invalid:invalid@localhost/invalid pnpm --filter @uneventful/api exec tsx prisma/seed.ts 2>&1)"; then
            echo "Seed unexpectedly succeeded with NODE_ENV=production." >&2
            exit 1
          fi
          if ! grep -Fq "Database seeding is disabled in production." <<<"$output"; then
            echo "Seed failed for a reason other than the production guard." >&2
            printf '%s\n' "$output" >&2
            exit 1
          fi
          echo "Seed refused production as expected."

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: API unit tests
        run: pnpm --filter @uneventful/api test

      - name: Web unit tests
        run: pnpm --filter @uneventful/web test

      - name: Recommendation evaluation smoke check
        run: pnpm --filter @uneventful/api recommendations:evaluate
        continue-on-error: true

      - name: Install Playwright Chromium
        run: pnpm --filter @uneventful/web exec playwright install --with-deps chromium

      - name: Start disposable S3-compatible test storage
        shell: bash
        run: |
          docker run --detach --rm \
            --name uneventful-e2e-object-storage \
            --publish 127.0.0.1:7070:7070 \
            --env "ROOT_ACCESS_KEY=$E2E_S3_ACCESS_KEY" \
            --env "ROOT_SECRET_KEY=$E2E_S3_SECRET_KEY" \
            ghcr.io/versity/versitygw@sha256:dd880fd85c3faba0411da8798d3f6f0827a779d962f257f3624b1fef76d56b7b \
            --port :7070 --health /health --quiet posix /tmp
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:7070/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "The object-storage test service did not become ready." >&2
          exit 1

      - name: Verify Playwright test-count minimum
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/playwright-test-list.json"
          pnpm --filter @uneventful/web exec playwright test --list --reporter=json > "$results"
          node -e '
            const report = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const count = (suites) => suites.reduce(
              (total, suite) => total + (suite.specs?.length ?? 0) + count(suite.suites ?? []),
              0
            );
            const testCount = count(report.suites);
            console.log(`Playwright test count: ${testCount}`);
            const minimumTestCount = 36;
            if (testCount < minimumTestCount) {
              console.error(`Playwright suite ran ${testCount} tests; minimum is ${minimumTestCount}.`);
              process.exit(1);
            }
          ' "$results"
        env:
          DATABASE_URL: postgresql://uneventful_app:${{ env.E2E_APP_DB_PASSWORD }}@localhost:5432/uneventful_ci?schema=public
          REDIS_URL: redis://localhost:6379
          NEXT_PUBLIC_WEB_ORIGIN: http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
          OBJECT_STORAGE_ENDPOINT: http://localhost:7070
          AWS_ACCESS_KEY_ID: ${{ env.E2E_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.E2E_S3_SECRET_KEY }}
          E2E_TEST_AUTH_BYPASS: '1'
          E2E_TEST_AUTH_BYPASS_SECRET: ${{ env.E2E_TEST_AUTH_BYPASS_SECRET }}
          NODE_ENV: test

      - name: Full Playwright end-to-end suite
        run: pnpm --filter @uneventful/web test:e2e --workers=2
        env:
          DATABASE_URL: postgresql://uneventful_app:${{ env.E2E_APP_DB_PASSWORD }}@localhost:5432/uneventful_ci?schema=public
          REDIS_URL: redis://localhost:6379
          NEXT_PUBLIC_WEB_ORIGIN: http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
          OBJECT_STORAGE_ENDPOINT: http://localhost:7070
          AWS_ACCESS_KEY_ID: ${{ env.E2E_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.E2E_S3_SECRET_KEY }}
          E2E_TEST_AUTH_BYPASS: '1'
          E2E_TEST_AUTH_BYPASS_SECRET: ${{ env.E2E_TEST_AUTH_BYPASS_SECRET }}
          NODE_ENV: test

      - name: Stop disposable object-storage service
        if: always()
        run: docker rm --force uneventful-e2e-object-storage >/dev/null 2>&1 || true

      - name: Full API PostgreSQL and Redis integration suite
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/api-integration-results.json"

          set +e
          pnpm --filter @uneventful/api test:integration \
            --reporter=default \
            --reporter=json \
            --outputFile.json="$results"
          test_exit=$?
          set -e

          if [[ ! -s "$results" ]]; then
            echo "Vitest did not produce an integration test report." >&2
            exit 1
          fi

          test_count="$(node -e '
            const report = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (!Number.isSafeInteger(report.numTotalTests)) {
              throw new Error("Vitest report has no valid numTotalTests count.");
            }
            process.stdout.write(String(report.numTotalTests));
          ' "$results")"
          echo "API integration test count: $test_count"

          node -e '
            const path = require("node:path");
            const report = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const files = report.testResults.map((result) =>
              path.relative(process.cwd(), result.name).replaceAll("\\", "/")
            ).sort();
            console.log("API integration test files:");
            for (const file of files) console.log(` - ${file}`);
          ' "$results"

          # Raise this threshold whenever integration tests are added.
          minimum_test_count=118
          if (( test_count < minimum_test_count )); then
            echo "The API integration suite ran $test_count tests; minimum is $minimum_test_count." >&2
            exit 1
          fi

          exit "$test_exit"
        env:
          TEST_DATABASE_URL: postgresql://uneventful_app:${{ env.E2E_APP_DB_PASSWORD }}@localhost:5432/uneventful_ci?schema=public
          TEST_MIGRATION_DATABASE_URL: postgresql://uneventful_migrator:${{ env.E2E_MIGRATOR_DB_PASSWORD }}@localhost:5432/uneventful_ci?schema=public
          TEST_REDIS_URL: redis://localhost:6379

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_WEB_ORIGIN: http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1

      - name: Verify build created no untracked files
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain)"
          if grep -q '^?? ' <<< "$status"; then
            echo "Build left untracked files in the worktree:" >&2
            grep '^?? ' <<< "$status" >&2
            exit 1
          fi

      - name: Verify test auth bypass is excluded from production API build
        shell: bash
        run: |
          if grep -R -n '__test/e2e' apps/api/dist; then
            echo "Test-only E2E routes were included in the production API build." >&2
            exit 1
          fi

      - name: Verify production API refuses the E2E auth-bypass flag
        shell: bash
        run: |
          set +e
          output="$(env NODE_ENV=production E2E_TEST_AUTH_BYPASS=1 pnpm --filter @uneventful/api start 2>&1)"
          start_exit=$?
          set -e
          if [[ "$start_exit" -eq 0 ]] || ! grep -Fq 'E2E_TEST_AUTH_BYPASS is forbidden in production.' <<<"$output"; then
            echo "Production API did not refuse the E2E auth-bypass flag for the expected reason." >&2
            printf '%s\n' "$output" >&2
            exit 1
          fi
          echo "Production API refused startup with the E2E auth-bypass flag."

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.24.11
          cache: false

      - name: Install Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan repository history
        run: gitleaks git --redact --no-banner

      - name: Verify Gitleaks detects a committed fake secret
        shell: bash
        run: |
          set -euo pipefail
          test_repo="$(mktemp -d)"
          report="$RUNNER_TEMP/gitleaks-fixture-report.json"
          trap 'rm -rf "$test_repo" "$report"' EXIT
          git -C "$test_repo" init --quiet
          git -C "$test_repo" config user.name "Gitleaks Test"
          git -C "$test_repo" config user.email "gitleaks-test@example.invalid"
          part_a='ghp_123456789012345678'
          part_b='901234567890123456'
          printf 'GITHUB_TOKEN=%s%s\n' "$part_a" "$part_b" > "$test_repo/fake-secret.txt"
          git -C "$test_repo" add fake-secret.txt
          git -C "$test_repo" commit --quiet -m "Add fake credential fixture"
          if gitleaks git "$test_repo" --report-format json --report-path "$report" --redact --no-banner; then
            echo "Gitleaks unexpectedly reported no findings for the committed fake secret." >&2
            exit 1
          fi
          if ! grep -Eq '"RuleID":[[:space:]]*"github-pat"' "$report"; then
            echo "Gitleaks failed without reporting the expected GitHub PAT finding." >&2
            exit 1
          fi
          echo "Gitleaks detected the committed fake GitHub token."

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --verify-store-integrity

      - name: Audit the pnpm lockfile
        run: pnpm audit --audit-level=high

      - name: Audit npm manifests
        run: |
          npm audit --no-package-lock --audit-level=high --prefix apps/web
          npm audit --no-package-lock --audit-level=high --prefix apps/api

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.185.0

      - name: Scan TypeScript with OWASP and TypeScript rules
        run: >-
          semgrep scan --error
          --exclude='**/.next/**' --exclude='**/dist/**'
          --exclude='**/node_modules/**' --exclude='**/coverage/**'
          --config p/owasp-top-ten --config p/typescript apps

  osv-scanner:
    name: osv-scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      scan-args: |-
        --lockfile=./pnpm-lock.yaml
      fail-on-vuln: false
    permissions:
      actions: read
      contents: read
      security-events: write

  zap-baseline:
    name: zap-baseline (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --verify-store-integrity

      - name: Build the web app
        run: pnpm --filter @uneventful/web build
        env:
          NEXT_PUBLIC_WEB_ORIGIN: http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1

      - name: Start the web app
        run: |
          pnpm --filter @uneventful/web start > "$RUNNER_TEMP/web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/web.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/web.log"
          echo "The web app did not become ready for the ZAP scan." >&2
          exit 1
        env:
          NODE_ENV: production
          NEXT_PUBLIC_WEB_ORIGIN: http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
          target: http://localhost:3000/login
          allow_issue_writing: false
          fail_action: false
