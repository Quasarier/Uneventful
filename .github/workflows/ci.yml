name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Verify lockfile matches manifests
        run: pnpm install --lockfile-only --frozen-lockfile --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --verify-store-integrity

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.24.11
          cache: false

      - name: Install Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan repository history
        run: gitleaks git --redact --no-banner

      - name: Verify Gitleaks detects a committed fake secret
        shell: bash
        run: |
          set -euo pipefail
          test_repo="$(mktemp -d)"
          report="$RUNNER_TEMP/gitleaks-fixture-report.json"
          trap 'rm -rf "$test_repo" "$report"' EXIT
          git -C "$test_repo" init --quiet
          git -C "$test_repo" config user.name "Gitleaks Test"
          git -C "$test_repo" config user.email "gitleaks-test@example.invalid"
          part_a='ghp_123456789012345678'
          part_b='901234567890123456'
          printf 'GITHUB_TOKEN=%s%s\n' "$part_a" "$part_b" > "$test_repo/fake-secret.txt"
          git -C "$test_repo" add fake-secret.txt
          git -C "$test_repo" commit --quiet -m "Add fake credential fixture"
          if gitleaks git "$test_repo" --report-format json --report-path "$report" --redact --no-banner; then
            echo "Gitleaks unexpectedly reported no findings for the committed fake secret." >&2
            exit 1
          fi
          if ! grep -Eq '"RuleID":[[:space:]]*"github-pat"' "$report"; then
            echo "Gitleaks failed without reporting the expected GitHub PAT finding." >&2
            exit 1
          fi
          echo "Gitleaks detected the committed fake GitHub token."

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --verify-store-integrity

      - name: Audit the pnpm lockfile
        run: pnpm audit --audit-level=high

      - name: Audit npm manifests
        run: |
          npm audit --no-package-lock --audit-level=high --prefix apps/web
          npm audit --no-package-lock --audit-level=high --prefix apps/api

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.185.0

      - name: Scan TypeScript with OWASP and TypeScript rules
        run: >-
          semgrep scan --error
          --exclude='**/.next/**' --exclude='**/dist/**'
          --exclude='**/node_modules/**' --exclude='**/coverage/**'
          --config p/owasp-top-ten --config p/typescript apps

  osv-scanner:
    name: osv-scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      scan-args: |-
        --lockfile=./pnpm-lock.yaml
      fail-on-vuln: false
    permissions:
      actions: read
      contents: read
      security-events: write
